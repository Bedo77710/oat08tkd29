<style>
/* ===== Taekwondo Dynamic Background ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #090d16 0%, #1e1b4b 40%, #111827 70%, #1a0c18 100%);
  background-size: 400% 400%;
  animation: tkdFlow 15s ease infinite;
}
@keyframes tkdFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== Taekwondo Dobok & Belt Ring ===== */
.tkd-ring {
  background: conic-gradient(from 0deg, #ef4444, #2563eb, #111827, #ef4444);
  padding: 4px;
  border-radius: 50%;
  box-shadow: 0 0 25px rgba(37, 99, 235, 0.5), 0 0 25px rgba(239, 68, 68, 0.5);
  animation: ringPulse 4s ease-in-out infinite alternate;
}
@keyframes ringPulse {
  0% { box-shadow: 0 0 15px rgba(37, 99, 235, 0.4), 0 0 15px rgba(239, 68, 68, 0.4); }
  100% { box-shadow: 0 0 30px rgba(37, 99, 235, 0.8), 0 0 30px rgba(239, 68, 68, 0.8); }
}

/* ===== Taekwondo Power Name ===== */
.tkd-name {
  font-weight: 800;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  text-shadow: 0 0 12px rgba(37, 99, 235, 0.8), 0 0 20px rgba(239, 68, 68, 0.6);
}

/* ===== Martial Arts Buttons ===== */
.btn-tkd {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.12);
  position: relative;
  overflow: hidden;
}
.btn-tkd::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
  transition: 0.5s;
}
.btn-tkd:hover::before {
  left: 100%;
}
.btn-tkd:hover {
  transform: translateY(-3px) scale(1.02);
  border-color: rgba(37, 99, 235, 0.6);
  box-shadow: 0 8px 25px -5px rgba(37, 99, 235, 0.4), 0 8px 25px -5px rgba(239, 68, 68, 0.3);
}

/* ===== Page Entrance ===== */
.fade-slide {
  opacity: 0;
  transform: translateY(30px) scale(0.98);
  animation: fadeInSlide 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes fadeInSlide {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== Kick Touch Effect ===== */
.touch-glow {
  position: absolute;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(239, 68, 68, 0.6) 0%, rgba(37, 99, 235, 0.3) 50%, transparent 80%);
  transform: translate(-50%, -50%);
  animation: touchFade 0.4s ease-out forwards;
}
@keyframes touchFade {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
}
</style>
</head>

<audio id="click" preload="auto">

</audio>

<script>
// Optimized Click Sound
function clickSound() {
  const audio = document.getElementById("click");
  audio.currentTime = 0;
  audio.play().catch(err => console.log("Audio play deferred"));
}

// Touch Effect for Mobile
document.addEventListener('touchstart', e => {
  const glow = document.createElement('div');
  glow.className = 'touch-glow';
  glow.style.left = e.touches[0].clientX + 'px';
  glow.style.top = e.touches[0].clientY + 'px';
  document.body.appendChild(glow);
  setTimeout(() => glow.remove(), 400);
});
</script>
