<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obaida Ahmed Al-Tarawneh | Taekwondo</title>

<!-- غيّر الرابط لرابط موقعك الكامل ليظهر في المعاينة -->
<meta property="og:title" content="Obaida Ahmed Al-Tarawneh - Taekwondo Profile">
<meta property="og:description" content="Official Social Media Links">
<meta property="og:image" content="https://YOUR-SITE.com/img.jpg">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#070605; --ink2:#0e0c09; --gold:#c9a45c; --gold2:#f1deb0; --gold3:#8a6a2b;
  --text:#ece4d3; --dim:#9a9078; --line:rgba(201,164,92,.28);
}
html,body{height:100%}
body{
  margin:0;color:var(--text);font-family:'Jost','Segoe UI',sans-serif;font-weight:300;
  background:
    radial-gradient(ellipse 80% 55% at 50% -5%,rgba(201,164,92,.16),transparent 65%),
    radial-gradient(ellipse 70% 40% at 50% 108%,rgba(201,164,92,.10),transparent 70%),
    var(--ink);
  overflow-x:hidden;
}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* film grain */
body::before{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#dust{position:fixed;inset:0;z-index:0;pointer-events:none}
#spot{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(201,164,92,.13),transparent 65%);
  transform:translate(-50%,-50%);left:50%;top:30%;transition:opacity .4s}

/* thin frame around the viewport */
.edge{position:fixed;inset:12px;border:1px solid var(--line);pointer-events:none;z-index:5;opacity:0;transition:opacity 1.2s 1.2s}
body.go .edge{opacity:1}

/* ===== Intro curtain ===== */
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;cursor:pointer}
#intro .half{position:absolute;top:0;bottom:0;width:50.2%;background:#050403;transition:transform 1.2s cubic-bezier(.77,0,.18,1)}
#intro .l{left:0}#intro .r{right:0}
#intro.open .l{transform:translateX(-101%)}
#intro.open .r{transform:translateX(101%)}
#intro .mono{position:relative;z-index:2;text-align:center;transition:opacity .5s}
#intro.open .mono{opacity:0}
.mono .ol{font-family:'Cormorant Garamond',serif;font-size:4.2rem;font-weight:600;line-height:1;letter-spacing:.12em;
  background:linear-gradient(120deg,var(--gold3),var(--gold2) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:fadeUp 1.1s .35s ease forwards}
.mono .ln{width:0;height:1px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:ln 1.2s .2s ease forwards}
.mono .tx{font-size:.62rem;letter-spacing:.55em;color:var(--dim);opacity:0;animation:fadeUp 1s .9s ease forwards;padding-left:.55em}
@keyframes ln{to{width:190px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#intro.gone{display:none}

/* ===== Main ===== */
main{position:relative;z-index:10;opacity:0;transform:translateY(18px);transition:opacity 1.2s .9s ease,transform 1.2s .9s ease}
body.go main{opacity:1;transform:none}

/* arch portrait (static) */
.arch{position:relative;width:176px;height:224px;margin:0 auto}
.arch .ring{position:absolute;inset:-9px;border:1px solid var(--line);border-radius:999px 999px 8px 8px}
.arch .gb{position:absolute;inset:0;padding:3px;border-radius:999px 999px 6px 6px;
  background:linear-gradient(160deg,var(--gold2),var(--gold) 38%,var(--gold3) 70%,var(--gold2));
  box-shadow:0 0 50px rgba(201,164,92,.22),0 24px 50px rgba(0,0,0,.65)}
.arch .ph{width:100%;height:100%;border-radius:999px 999px 4px 4px;overflow:hidden;background:#000;position:relative}
.arch img{width:100%;height:100%;object-fit:cover;filter:contrast(1.04) saturate(.92)}
.arch .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 62%,rgba(7,6,5,.55))}
.seal{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);z-index:3;
  width:34px;height:34px;border-radius:50%;background:var(--ink);border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:.8rem;box-shadow:0 0 18px rgba(201,164,92,.35)}

/* name */
.name{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.7rem;line-height:1.02;letter-spacing:.05em;margin:0;
  background:linear-gradient(100deg,#b88f45 0%,#f6e6b8 28%,#c9a45c 50%,#f6e6b8 72%,#b88f45 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.fam{font-size:.78rem;letter-spacing:.5em;color:var(--dim);padding-left:.5em}
.role{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:var(--gold2);opacity:.9}

.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
.orn i{display:block;height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}
.orn b{width:6px;height:6px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 10px var(--gold)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:14px 0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2rem;line-height:1;color:var(--gold2)}
.stats span{display:block;margin-top:6px;font-size:.6rem;letter-spacing:.35em;color:var(--dim);padding-left:.35em}

/* link rows */
.row{position:relative;display:flex;align-items:center;gap:16px;padding:14px 18px;overflow:hidden;
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
  backdrop-filter:blur(8px);transition:border-color .4s,transform .4s,box-shadow .4s;
  opacity:0;transform:translateY(16px)}
body.go .row{animation:rowIn .9s cubic-bezier(.16,1,.3,1) forwards}
body.go .row:nth-child(1){animation-delay:1.9s}
body.go .row:nth-child(2){animation-delay:2.05s}
body.go .row:nth-child(3){animation-delay:2.2s}
body.go .row:nth-child(4){animation-delay:2.35s}
body.go .row:nth-child(5){animation-delay:2.5s}
@keyframes rowIn{to{opacity:1;transform:none}}
.row::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(201,164,92,.18),transparent 70%)}
.row::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(241,222,176,.22),transparent);transform:skewX(-20deg);transition:left .9s ease}
.row:hover,.row:focus-visible{border-color:var(--gold);transform:translateY(-3px);outline:none;
  box-shadow:0 14px 34px -12px rgba(201,164,92,.35),0 0 0 1px rgba(201,164,92,.15)}
.row:hover::before{opacity:1}
.row:hover::after{left:140%}
.row:active{transform:scale(.985)}
.row .ic{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--gold2);font-size:1.05rem;transition:all .4s}
.row:hover .ic{background:var(--gold);color:var(--ink);border-color:var(--gold);box-shadow:0 0 18px rgba(201,164,92,.55)}
.row .t{flex:1;text-align:left}
.row .t b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.3rem;letter-spacing:.06em;color:var(--text);line-height:1.1}
.row .t small{display:block;font-size:.62rem;letter-spacing:.3em;color:var(--dim);margin-top:3px}
.row .ar{color:var(--gold);font-size:.75rem;opacity:.5;transition:all .4s}
.row:hover .ar{opacity:1;transform:translateX(5px)}

.foot{font-size:.62rem;letter-spacing:.4em;color:var(--dim)}
.share{font-size:.68rem;letter-spacing:.35em;color:var(--gold);border:none;background:none;cursor:pointer;transition:color .3s;padding:6px 10px}
.share:hover{color:var(--gold2)}

.ripple{position:fixed;width:80px;height:80px;border-radius:50%;border:1px solid var(--gold);pointer-events:none;z-index:60;
  transform:translate(-50%,-50%);animation:rip .9s ease-out forwards}
@keyframes rip{from{opacity:.9;transform:translate(-50%,-50%) scale(.2)}to{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  main,.row{opacity:1!important;transform:none!important}
  #intro{display:none}
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center py-14 px-5">

<canvas id="dust"></canvas>

<!-- Intro -->

<main class="w-full max-w-sm text-center space-y-7">

  <!-- Links -->
  <div class="flex flex-col gap-3.5">

</main>

<script>
/* ===== Soft chime (synth, no external file) ===== */
let AC;
function chime(e){
  if(navigator.vibrate) navigator.vibrate(18);
  if(e) ripple(e.clientX,e.clientY);
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    [659.25,987.77,1318.5].forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.05);
      g.gain.linearRampToValueAtTime(.12,t+i*.05+.02);
      g.gain.exponentialRampToValueAtTime(.0005,t+i*.05+1.1);
      o.connect(g).connect(AC.destination);o.start(t+i*.05);o.stop(t+i*.05+1.15);
    });
  }catch(_){}
}
function ripple(x,y){
  const r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';
  document.body.appendChild(r);setTimeout(()=>r.remove(),900);
}

/* ===== Intro ===== */
const intro=document.getElementById('intro');
let opened=false;
function openCurtain(){
  if(opened)return;opened=true;
  intro.classList.add('open');
  setTimeout(()=>{document.body.classList.add('go');startCounters()},350);
  setTimeout(()=>intro.classList.add('gone'),1500);
}
intro.addEventListener('click',openCurtain);
window.addEventListener('load',()=>setTimeout(openCurtain,2100));
if(matchMedia('(prefers-reduced-motion: reduce)').matches)
  window.addEventListener('load',()=>{document.body.classList.add('go');startCounters()});

/* ===== Counters ===== */
function startCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const end=+el.dataset.count;let n=0;
    const step=Math.max(1,Math.ceil(end/45));
    setTimeout(()=>{
      const t=setInterval(()=>{
        n=Math.min(end,n+step);el.textContent=n+(n===end?'+':'');
        if(n===end)clearInterval(t);
      },32);
    },1600);
  });
}

/* ===== Spotlight follows cursor / finger ===== */
const spot=document.getElementById('spot');
function mv(x,y){spot.style.left=x+'px';spot.style.top=y+'px'}
document.addEventListener('mousemove',e=>mv(e.clientX,e.clientY));
document.addEventListener('touchmove',e=>mv(e.touches[0].clientX,e.touches[0].clientY),{passive:true});

/* per-row glow */
document.querySelectorAll('.row').forEach(r=>{
  r.addEventListener('mousemove',e=>{
    const b=r.getBoundingClientRect();
    r.style.setProperty('--mx',(e.clientX-b.left)+'px');
    r.style.setProperty('--my',(e.clientY-b.top)+'px');
  });
});

/* ===== Gold dust ===== */
const cv=document.getElementById('dust'),cx=cv.getContext('2d');
function size(){cv.width=innerWidth;cv.height=innerHeight}
size();addEventListener('resize',size);
const P=[];
for(let i=0;i<55;i++)P.push({
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:Math.random()*1.5+.3,vx:(Math.random()-.5)*.12,vy:-Math.random()*.28-.04,
  a:Math.random()*.55+.1,tw:Math.random()*6.28
});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.tw+=.02;
    if(p.y<-5){p.y=cv.height+5;p.x=Math.random()*cv.width}
    const a=p.a*(.55+.45*Math.sin(p.tw));
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);
    cx.fillStyle=`rgba(241,222,176,${a})`;cx.shadowBlur=8;cx.shadowColor='rgba(201,164,92,.8)';cx.fill();
  });
  requestAnimationFrame(loop);
})();

/* ===== Share ===== */
function sharePage(){
  if(navigator.share)navigator.share({title:document.title,url:location.href}).catch(()=>{});
  else navigator.clipboard.writeText(location.href).then(()=>alert('Link copied'));
}
</script>
</body>
