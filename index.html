<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obaida Ahmed Al-Tarawneh</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
/* ===== Background Dynamic Flow ===== */
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(270deg, #0f172a, #1e1b4b, #0f172a, #1e1b4b);
  background-size: 800% 800%;
  animation: bgFlow 20s ease infinite;
}
@keyframes bgFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== Profile Neon Ring ===== */
.profile-ring {
  background: conic-gradient(from 0deg, #6366f1, #3b82f6, #6366f1);
  padding: 3px;
  border-radius: 50%;
  animation: ringRotate 8s linear infinite;
}
@keyframes ringRotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ===== Neon Name ===== */
.neon-name {
  font-weight: 700;
  color: #fff;
  text-shadow: 0 0 12px #6366f1, 0 0 28px #3b82f6, 0 0 40px #6366f1;
  animation: neonPulse 2.5s ease-in-out infinite alternate, floatName 4s ease-in-out infinite alternate;
}
@keyframes neonPulse {
  from { text-shadow: 0 0 12px #6366f1, 0 0 28px #3b82f6; }
  to { text-shadow: 0 0 25px #3b82f6, 0 0 50px #6366f1; }
}
@keyframes floatName {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
  100% { transform: translateY(0px); }
}

/* ===== Social Buttons ===== */
.btn {
  transition: all .3s ease;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 0 20px #6366f1, 0 0 40px #3b82f6;
}

/* ===== Page Entrance ===== */
.fade-slide {
  opacity: 0;
  transform: translateY(40px) scale(0.95);
  animation: fadeInSlide 1.2s forwards;
}
@keyframes fadeInSlide {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== Touch Glow Effect ===== */
.touch-glow {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(99,102,241,0.4) 0%, transparent 80%);
  transform: translate(-50%, -50%);
  animation: touchFade 0.5s forwards;
}
@keyframes touchFade {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center text-white relative overflow-hidden">

<main class="w-full max-w-sm text-center space-y-10 fade-slide">

  <!-- Profile -->
  <div class="mx-auto w-36 h-36 rounded-full profile-ring">
    <div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center overflow-hidden">
      <img src="img.jpg" alt="Obaida Profile" class="w-full h-full object-cover rounded-full">
    </div>
  </div>

  <!-- Name -->
  <h1 class="text-3xl sm:text-4xl neon-name tracking-wide">
    Obaida Ahmed Al-Tarawneh
  </h1>

  <!-- Social Buttons -->
  <div class="flex flex-col gap-4">

    <a onclick="clickSound()" href="https://www.instagram.com/t_obaidaa?igsh=OTVzN3NuNTB2cmZh" target="_blank"
       class="btn py-3 rounded-xl bg-white/5 flex items-center justify-center gap-3">
      <i class="fab fa-instagram text-pink-400"></i> Instagram
    </a>

    <a onclick="clickSound()" href="https://www.facebook.com/share/1B1Kwhfv7Z/" target="_blank"
       class="btn py-3 rounded-xl bg-white/5 flex items-center justify-center gap-3">
      <i class="fab fa-facebook text-blue-400"></i> Facebook
    </a>

    <a onclick="clickSound()" href="https://www.snapchat.com/add/obiadaat" target="_blank"
       class="btn py-3 rounded-xl bg-white/5 flex items-center justify-center gap-3">
      <i class="fab fa-snapchat text-yellow-300"></i> Snapchat
    </a>

    <a onclick="clickSound()" href="https://www.tiktok.com/@t_obaidaa" target="_blank"
       class="btn py-3 rounded-xl bg-white/5 flex items-center justify-center gap-3">
      <i class="fab fa-tiktok text-pink-500"></i> TikTok
    </a>

    <a onclick="clickSound()" href="http://vsco.co/obiadaproo" target="_blank"
       class="btn py-3 rounded-xl bg-white/5 flex items-center justify-center gap-3">
      <i class="fas fa-camera text-slate-300"></i> VSCO
    </a>

  </div>

</main>

<!-- Click Sound -->
<audio id="click">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-click-melodic-tone-1129.mp3" type="audio/mpeg">
</audio>

<script>
// Click sound
function clickSound() {
  document.getElementById("click").play();
}

// Touch Glow Effect for Mobile
document.addEventListener('touchstart', e => {
  const glow = document.createElement('div');
  glow.className = 'touch-glow';
  glow.style.left = e.touches[0].clientX + 'px';
  glow.style.top = e.touches[0].clientY + 'px';
  document.body.appendChild(glow);
  setTimeout(() => glow.remove(), 500);
});
</script>

</body>
</html>
